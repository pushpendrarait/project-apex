<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Apex | Unified Sports Facility Booking Platform</title>
  <meta name="description" content="Instant multi-tenant sports turf, court and pitch booking platform for Thane, Mumbai, and Navi Mumbai. BookMyShow & Snabbit inspired sports booking experience with dynamic odd-hour discounts.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#10b981',
              dark: '#059669',
              light: '#34d399'
            },
            bms: {
              DEFAULT: '#F84464',
              hover: '#E03050',
              dark: '#C42040'
            },
            turf: {
              DEFAULT: '#00D26A',
              light: '#10B981',
              dark: '#059669'
            },
            midnight: {
              950: '#090D16',
              900: '#0F172A',
              850: '#131B2E',
              800: '#1E293B',
              700: '#334155'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #090D16;
      background-image: 
        radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.07) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(248, 68, 100, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(168, 85, 247, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    /* Hide scrollbars for slick mobile strips */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .glow-turf {
      box-shadow: 0 0 25px -4px rgba(0, 210, 106, 0.35);
    }
    .glow-bms {
      box-shadow: 0 0 25px -4px rgba(248, 68, 100, 0.35);
    }
    .glow-purple {
      box-shadow: 0 0 25px -4px rgba(168, 85, 247, 0.35);
    }
    .glass-card {
      background: rgba(19, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-header {
      background: rgba(9, 13, 22, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-[#090D16] text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Top App Navigation (BookMyShow + Snabbit Header) -->
  <header class="sticky top-0 z-40 glass-header border-b border-white/[0.08]">
    <!-- Tier 1: Brand Logo, Location Selector, Omni Search & User Controls -->
    <div class="max-w-7xl mx-auto px-4 md:px-8 py-3">
      <div class="flex items-center justify-between gap-3 md:gap-6">
        
        <!-- Left: Brand Logo & BookMyShow-style City / Location Selector -->
        <div class="flex items-center gap-3 lg:gap-5 shrink-0">
          <!-- Brand Logo -->
          <div id="nav-brand" class="flex items-center gap-2.5 cursor-pointer group">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-400 to-[#F84464] p-0.5 shadow-lg shadow-emerald-500/20 group-hover:shadow-emerald-500/40 transition flex items-center justify-center">
              <div class="w-full h-full bg-[#090D16] rounded-[14px] flex items-center justify-center font-black text-emerald-400 text-lg group-hover:scale-105 transition-transform">
                ⚡
              </div>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xl font-black tracking-tight text-white group-hover:text-emerald-400 transition">APEX</span>
                <span class="text-[10px] uppercase font-black px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">SPORTS</span>
              </div>
              <span class="text-[10px] text-slate-400 font-medium hidden sm:block tracking-wide">Thane • Mumbai • Navi Mumbai</span>
            </div>

          <!-- BookMyShow Style Location Selector Button & Dropdown -->
          <div class="relative">

        <!-- Center: Global Omni-Search Bar (BookMyShow Style) -->

          <div class="relative">
            <input id="header-omni-search" type="text" placeholder="Search turfs, box cricket, football, areas (Bandra, Ghodbunder)..." class="w-full bg-slate-900/90 hover:bg-slate-900 border border-white/10 hover:border-emerald-500/50 focus:border-emerald-500 text-white placeholder-slate-400 rounded-2xl pl-10 pr-12 py-2 text-xs focus:ring-2 focus:ring-emerald-500/20 focus:outline-none transition shadow-inner" />
            <span class="absolute left-3.5 top-2.5 text-slate-400 text-xs">🔍</span>

        <!-- Right: Actions, Workflows, List Turf & User Switcher -->
        <div class="flex items-center gap-2 shrink-0">

      </div>

    <!-- Tier 2: Sub-Navigation Ribbon (Tabs & Quick Neighborhoods) -->
    <div class="border-t border-white/[0.06] bg-slate-950/60 px-4 md:px-8 py-2">
      <div class="max-w-7xl mx-auto flex items-center justify-between gap-4 overflow-x-auto scrollbar-none">
        
        <!-- Navigation Tabs (Desktop) -->
        <nav class="flex items-center gap-1 shrink-0">

        <!-- Micro-Neighborhood Quick Chips (BookMyShow / Snabbit Style) -->
        <div class="hidden md:flex items-center gap-1.5 text-[11px] shrink-0 text-slate-400">
          <span class="text-slate-500 font-semibold mr-1">Trending Areas:</span>
          <button data-area="Ghodbunder" class="header-area-chip px-2.5 py-1 rounded-full bg-slate-900 hover:bg-slate-800 hover:text-emerald-400 border border-white/5 transition">📍 Ghodbunder Rd</button>
          <button data-area="Majiwada" class="header-area-chip px-2.5 py-1 rounded-full bg-slate-900 hover:bg-slate-800 hover:text-emerald-400 border border-white/5 transition">📍 Majiwada</button>
          <button data-area="Bandra" class="header-area-chip px-2.5 py-1 rounded-full bg-slate-900 hover:bg-slate-800 hover:text-emerald-400 border border-white/5 transition">📍 Bandra West</button>
          <button data-area="Powai" class="header-area-chip px-2.5 py-1 rounded-full bg-slate-900 hover:bg-slate-800 hover:text-emerald-400 border border-white/5 transition">📍 Powai</button>
          <button data-area="BKC" class="header-area-chip px-2.5 py-1 rounded-full bg-slate-900 hover:bg-slate-800 hover:text-emerald-400 border border-white/5 transition">📍 BKC</button>
          <button data-area="Vashi" class="header-area-chip px-2.5 py-1 rounded-full bg-slate-900 hover:bg-slate-800 hover:text-emerald-400 border border-white/5 transition">📍 Vashi</button>

          <span>Project Apex</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">BookMyShow & Snabbit Look & Feel</span>

  <!-- Application Bootstrap Script -->
  <script type="module">
    import { VenueExplorer } from './src/components/VenueExplorer.js';
    import { SlotCalendar } from './src/components/SlotCalendar.js';
    import { CheckoutModal } from './src/components/CheckoutModal.js';
    import { BookingConfirmation } from './src/components/BookingConfirmation.js';
    import { PlayerPortal } from './src/components/PlayerPortal.js';
    import { VenueOwnerPortal } from './src/components/VenueOwnerPortal.js';
    import { AdminConsole } from './src/components/AdminConsole.js';
    import { LegalModal } from './src/components/LegalModal.js';
    import { UserService } from './src/services/userService.js';
    import { AddVenueModal } from './src/components/AddVenueModal.js';
    import { UserAuthModal } from './src/components/UserAuthModal.js';
    import { ScenarioRunnerModal } from './src/components/ScenarioRunnerModal.js';

    class ApexApp {
      constructor() {
        this.appRoot = document.getElementById('app-root');
        this.currentView = 'explore';
        this.selectedVenue = null;
        this.activeBooking = null;
        this.explorer = null;
        this.init();
      }

      init() {
        this.updateHeaderUser();
        this.bindNavEvents();
        this.bindHeaderLocationAndSearch();
        this.bindLegalEvents();
        this.registerServiceWorker();
        this.renderView('explore');
      }

      updateHeaderUser() {
        const user = UserService.getCurrentUser();
        const avatar = document.getElementById('header-user-avatar');
        const nameEl = document.getElementById('header-user-name');
        const roleEl = document.getElementById('header-user-role');
        const authBtn = document.getElementById('btn-header-auth');

        if (user) {
          if (avatar) {
            avatar.textContent = user.displayName.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            avatar.className = user.role === 'venue_owner'
              ? 'w-6 h-6 rounded-lg bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 font-black text-[11px] flex items-center justify-center'
              : 'w-6 h-6 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-black text-[11px] flex items-center justify-center';
          }
          if (nameEl) {
            nameEl.textContent = user.displayName.split(' ')[0];
          }
          if (roleEl) {
            roleEl.textContent = user.role === 'venue_owner' ? 'Owner' : 'Player';
            roleEl.className = user.role === 'venue_owner'
              ? 'text-[9px] uppercase px-1.5 py-0.2 rounded font-mono bg-indigo-950 text-indigo-300 border border-indigo-800 hidden lg:inline'
              : 'text-[9px] uppercase px-1.5 py-0.2 rounded font-mono bg-emerald-950 text-emerald-400 border border-emerald-800 hidden lg:inline';
          }
          if (authBtn) {
            authBtn.innerHTML = `<span>👤 ${user.displayName.split(' ')[0]}</span>`;
          }
        } else {
          if (avatar) {
            avatar.textContent = '👤';
            avatar.className = 'w-6 h-6 rounded-lg bg-slate-800 border border-slate-700 text-slate-400 font-black text-[11px] flex items-center justify-center';
          }
          if (nameEl) {
            nameEl.textContent = 'Guest';
          }
          if (roleEl) {
            roleEl.textContent = 'Guest';
            roleEl.className = 'text-[9px] uppercase px-1.5 py-0.2 rounded font-mono bg-slate-800 text-slate-400 border border-slate-700 hidden lg:inline';
          }
          if (authBtn) {
            authBtn.innerHTML = `<span>🔑 Login / Register</span>`;
          }
        }
      }

      registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('Project Apex ServiceWorker active:', reg.scope))
              .catch(err => console.log('SW registration skipped:', err));
          });
        }
      }

      bindHeaderLocationAndSearch() {
        const locBtn = document.getElementById('btn-location-selector');
        const locFlyout = document.getElementById('location-dropdown-flyout');
        const locLabel = document.getElementById('current-location-label');
        const omniSearch = document.getElementById('header-omni-search');

        if (locBtn && locFlyout) {
          locBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            locFlyout.classList.toggle('hidden');
          });

          document.addEventListener('click', () => {
            locFlyout.classList.add('hidden');
          });

          locFlyout.querySelectorAll('.loc-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const city = e.currentTarget.getAttribute('data-city');
              if (locLabel) {
                locLabel.textContent = city === 'all' ? 'All Cities' : city.charAt(0).toUpperCase() + city.slice(1);
              }
              locFlyout.classList.add('hidden');

              if (this.currentView !== 'explore') {
                this.setTabActive('explore');
              }
              if (this.explorer) {
                this.explorer.setCity(city);
              }
            });
          });
        }

        // Omni-search input
        if (omniSearch) {
          omniSearch.addEventListener('input', (e) => {
            const query = e.target.value;
            if (this.currentView !== 'explore') {
              this.setTabActive('explore');
            }
            if (this.explorer) {
              this.explorer.setSearch(query);
            }
          });
        }

        // Quick area chips
        document.querySelectorAll('.header-area-chip').forEach(chip => {
          chip.addEventListener('click', (e) => {
            const area = e.currentTarget.getAttribute('data-area');
            if (this.currentView !== 'explore') {
              this.setTabActive('explore');
            }
            if (this.explorer) {
              this.explorer.setSearch(area);
            }
          });
        });

        // Keyboard shortcut "/" to focus omni-search
        window.addEventListener('keydown', (e) => {
          if (e.key === '/' && document.activeElement !== omniSearch && omniSearch) {
            e.preventDefault();
            omniSearch.focus();
          }
        });
      }

      bindNavEvents() {
        const setTabActive = (tabName) => {
          this.currentView = tabName;
          ['explore', 'bookings', 'partner', 'admin'].forEach(name => {
            const deskBtn = document.getElementById(`tab-${name}`);
            const mobBtn = document.getElementById(`mobile-tab-${name}`);
            const isActive = name === tabName;

            if (deskBtn) {
              deskBtn.className = isActive
                ? 'px-3.5 py-1.5 rounded-xl text-xs font-bold transition bg-emerald-500 text-slate-950 shadow-md'
                : 'px-3.5 py-1.5 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-slate-800';
            }
            if (mobBtn) {
              mobBtn.className = isActive
                ? 'flex flex-col items-center gap-1 text-emerald-400 font-bold'
                : 'flex flex-col items-center gap-1 text-slate-400';
            }
          });
          this.renderView(tabName);
        };
        this.setTabActive = setTabActive;

        document.getElementById('nav-brand').addEventListener('click', () => setTabActive('explore'));
        document.getElementById('tab-explore').addEventListener('click', () => setTabActive('explore'));
        document.getElementById('tab-bookings').addEventListener('click', () => setTabActive('bookings'));
        document.getElementById('tab-partner').addEventListener('click', () => setTabActive('partner'));
        document.getElementById('tab-admin').addEventListener('click', () => setTabActive('admin'));

        const btnScenarios = document.getElementById('btn-header-scenarios');
        if (btnScenarios) {
          btnScenarios.addEventListener('click', () => {
            ScenarioRunnerModal.show({
              onStateUpdated: () => {
                this.updateHeaderUser();
                this.renderView(this.currentView);
              }
            });
          });
        }

        const btnAuth = document.getElementById('btn-header-auth');
        if (btnAuth) {
          btnAuth.addEventListener('click', () => {
            UserAuthModal.show({
              initialTab: 'signin',
              onUserChanged: (user) => {
                this.updateHeaderUser();
                this.renderView(this.currentView);
              },
              onNavigate: (view) => {
                setTabActive(view);
              }
            });
          });
        }

        const btnAddVenue = document.getElementById('btn-header-add-venue');
        if (btnAddVenue) {
          btnAddVenue.addEventListener('click', () => {
            AddVenueModal.show({
              onVenueAdded: (newVenue) => {
                this.selectedVenue = newVenue;
                setTabActive('explore');
              }
            });
          });
        }

        const btnQuickPlayer = document.getElementById('btn-quick-player');
        if (btnQuickPlayer) {
          btnQuickPlayer.addEventListener('click', () => {
            UserAuthModal.show({
              onUserChanged: (user) => {
                this.updateHeaderUser();
                this.renderView(this.currentView);
              },
              onNavigate: (view) => {
                setTabActive(view);
              }
            });
          });
        }

        document.getElementById('mobile-tab-explore').addEventListener('click', () => setTabActive('explore'));
        document.getElementById('mobile-tab-bookings').addEventListener('click', () => setTabActive('bookings'));
        document.getElementById('mobile-tab-partner').addEventListener('click', () => setTabActive('partner'));
        document.getElementById('mobile-tab-admin').addEventListener('click', () => setTabActive('admin'));
      }

      bindLegalEvents() {
        document.getElementById('footer-link-tos').addEventListener('click', () => LegalModal.show('tos'));
        document.getElementById('footer-link-privacy').addEventListener('click', () => LegalModal.show('privacy'));
        document.getElementById('footer-link-injury').addEventListener('click', () => LegalModal.show('injury'));
      }

      renderView(viewName) {
        this.appRoot.innerHTML = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        switch (viewName) {
          case 'explore': {
            const explorer = new VenueExplorer({
              onSelectVenue: (venue) => {
                this.selectedVenue = venue;
                this.renderView('slots');
              },
              onUserChanged: (user) => {
                this.updateHeaderUser();
              },
              onNavigate: (view) => {
                if (this.setTabActive) this.setTabActive(view);
                else this.renderView(view);
              }
            });
            this.explorer = explorer;
            explorer.render(this.appRoot);
            break;
          }
          case 'slots': {
            if (!this.selectedVenue) {
              this.renderView('explore');
              return;
            }
            const calendar = new SlotCalendar({
              venue: this.selectedVenue,
              onProceedToCheckout: (bookingContext) => {
                const checkout = new CheckoutModal({
                  bookingContext,
                  onBookingSuccess: (booking) => {
                    this.activeBooking = booking;
                    this.renderView('confirmation');
                  },
                  onCancel: () => {
                    calendar.render(this.appRoot);
                  }
                });
                checkout.show();
              },
              onBack: () => {
                this.renderView('explore');
              }
            });
            calendar.render(this.appRoot);
            break;
          }
          case 'confirmation': {
            if (!this.activeBooking) {
              this.renderView('explore');
              return;
            }
            const confirmation = new BookingConfirmation({
              booking: this.activeBooking,
              onViewBookings: () => this.renderView('bookings'),
              onHome: () => this.renderView('explore')
            });
            confirmation.render(this.appRoot);
            break;
          }
          case 'bookings': {
            const portal = new PlayerPortal({
              onBack: () => this.renderView('explore'),
              onShowPass: (booking) => {
                this.activeBooking = booking;
                this.renderView('confirmation');
              }
            });
            portal.render(this.appRoot);
            break;
          }
          case 'partner': {
            const ownerPortal = new VenueOwnerPortal({
              onBack: () => this.renderView('explore')
            });
            ownerPortal.render(this.appRoot);
            break;
          }
          case 'admin': {
            const admin = new AdminConsole({
              onBack: () => this.renderView('explore')
            });
            admin.render(this.appRoot);
            break;
          }
          default:
            this.renderView('explore');
        }
      }
    }

    // Initialize application
    window.apexApp = new ApexApp();
  </script>
</body>
</html>
