<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project Apex | Unified Sports Facility Booking Platform</title>
  <meta name="description" content="Instant multi-tenant sports turf, court and pitch booking platform for Thane, Mumbai, and Navi Mumbai. Dynamic odd-hour discounts and zero double booking.">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#10b981',
              dark: '#059669',
              light: '#34d399'
            }
          }
        }
      }
    }
  </script>

  <!-- Google Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s ease-out forwards;
    }
    /* Hide scrollbars for slick mobile strips */
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Top App Navigation -->
  <header class="sticky top-0 z-40 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800/80 px-4 md:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      
      <!-- Brand Logo -->
      <div id="nav-brand" class="flex items-center gap-3 cursor-pointer">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 p-0.5 shadow-lg shadow-emerald-500/20 flex items-center justify-center">
          <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center font-black text-emerald-400 text-lg">
            ⚡
          </div>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xl font-black tracking-tight text-white">APEX</span>
            <span class="text-[10px] uppercase font-black px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">SPORTS</span>
          </div>
          <span class="text-[11px] text-slate-400 font-medium hidden sm:block">Thane • Mumbai • Navi Mumbai</span>
        </div>
      </div>

      <!-- Navigation Tabs (Desktop) -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800">
        <button id="tab-explore" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-emerald-500 text-slate-950 shadow-md">
          Explore Venues
        </button>
        <button id="tab-bookings" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-slate-800">
          My Passes
        </button>
        <button id="tab-partner" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-slate-800">
          Partner Portal
        </button>
        <button id="tab-admin" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-slate-800 flex items-center gap-1.5">
          <span>⚙️ Telemetry</span>
        </button>
      </nav>

      <!-- Actions, List Venue & User Switcher -->
      <div class="flex items-center gap-2">
        <button id="btn-header-add-venue" class="hidden sm:flex items-center gap-1 px-3 py-1.5 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs font-bold transition">
          <span>+ List Venue</span>
        </button>

        <button id="btn-quick-player" class="flex items-center gap-2 px-2.5 py-1.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-xs transition" title="Switch or Create User Profile">
          <div id="header-user-avatar" class="w-6 h-6 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-black text-[11px] flex items-center justify-center">
            RD
          </div>
          <span id="header-user-name" class="font-bold text-white text-xs hidden sm:inline">Rohan</span>
          <span class="text-[10px] text-slate-400">▾</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 pb-24 md:pb-12">
    <div id="app-root">
      <!-- Injected by application controller -->
    </div>
  </main>

  <!-- Bottom Mobile Navigation Bar -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-950/90 backdrop-blur-xl border-t border-slate-800 px-4 py-2 flex items-center justify-around text-[10px] font-bold">
    <button id="mobile-tab-explore" class="flex flex-col items-center gap-1 text-emerald-400">
      <span class="text-lg">🏟️</span>
      <span>Explore</span>
    </button>
    <button id="mobile-tab-bookings" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">🎟️</span>
      <span>My Passes</span>
    </button>
    <button id="mobile-tab-partner" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">🏢</span>
      <span>Partner</span>
    </button>
    <button id="mobile-tab-admin" class="flex flex-col items-center gap-1 text-slate-400">
      <span class="text-lg">⚙️</span>
      <span>Telemetry</span>
    </button>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-950 border-t border-slate-900 py-8 px-4 text-xs text-slate-500">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="space-y-1 text-center md:text-left">
        <div class="font-bold text-slate-300">Project Apex: Unified Sports Facility Booking Platform</div>
        <p>Targeting Thane, Mumbai, and Navi Mumbai urban athletic communities. 100% Firebase Spark Free Tier compliant.</p>
      </div>
      <div class="flex flex-wrap items-center justify-center gap-4 text-xs">
        <button id="footer-link-tos" class="hover:text-emerald-400 transition">Terms of Service</button>
        <span>•</span>
        <button id="footer-link-privacy" class="hover:text-emerald-400 transition">Privacy Policy (DPDP)</button>
        <span>•</span>
        <button id="footer-link-injury" class="hover:text-emerald-400 transition text-amber-400 font-semibold">Injury Liability Waiver</button>
      </div>
    </div>
  </footer>

  <!-- Application Bootstrap Script -->
  <script type="module">
    import { VenueExplorer } from './src/components/VenueExplorer.js';
    import { SlotCalendar } from './src/components/SlotCalendar.js';
    import { CheckoutModal } from './src/components/CheckoutModal.js';
    import { BookingConfirmation } from './src/components/BookingConfirmation.js';
    import { PlayerPortal } from './src/components/PlayerPortal.js';
    import { VenueOwnerPortal } from './src/components/VenueOwnerPortal.js';
    import { AdminConsole } from './src/components/AdminConsole.js';
    import { LegalModal } from './src/components/LegalModal.js';
    import { UserService } from './src/services/userService.js';
    import { AddVenueModal } from './src/components/AddVenueModal.js';
    import { UserAuthModal } from './src/components/UserAuthModal.js';

    class ApexApp {
      constructor() {
        this.appRoot = document.getElementById('app-root');
        this.currentView = 'explore';
        this.selectedVenue = null;
        this.activeBooking = null;
        this.init();
      }

      init() {
        this.updateHeaderUser();
        this.bindNavEvents();
        this.bindLegalEvents();
        this.registerServiceWorker();
        this.renderView('explore');
      }

      updateHeaderUser() {
        const user = UserService.getCurrentUser();
        const avatar = document.getElementById('header-user-avatar');
        const nameEl = document.getElementById('header-user-name');
        if (avatar && user) {
          avatar.textContent = user.displayName.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        }
        if (nameEl && user) {
          nameEl.textContent = user.displayName.split(' ')[0];
        }
      }

      registerServiceWorker() {
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('Project Apex ServiceWorker active:', reg.scope))
              .catch(err => console.log('SW registration skipped:', err));
          });
        }
      }

      bindNavEvents() {
        const setTabActive = (tabName) => {
          this.currentView = tabName;
          ['explore', 'bookings', 'partner', 'admin'].forEach(name => {
            const deskBtn = document.getElementById(`tab-${name}`);
            const mobBtn = document.getElementById(`mobile-tab-${name}`);
            const isActive = name === tabName;

            if (deskBtn) {
              deskBtn.className = isActive
                ? 'px-4 py-2 rounded-xl text-xs font-bold transition bg-emerald-500 text-slate-950 shadow-md'
                : 'px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-slate-800';
            }
            if (mobBtn) {
              mobBtn.className = isActive
                ? 'flex flex-col items-center gap-1 text-emerald-400 font-bold'
                : 'flex flex-col items-center gap-1 text-slate-400';
            }
          });
          this.renderView(tabName);
        };

        document.getElementById('nav-brand').addEventListener('click', () => setTabActive('explore'));
        document.getElementById('tab-explore').addEventListener('click', () => setTabActive('explore'));
        document.getElementById('tab-bookings').addEventListener('click', () => setTabActive('bookings'));
        document.getElementById('tab-partner').addEventListener('click', () => setTabActive('partner'));
        document.getElementById('tab-admin').addEventListener('click', () => setTabActive('admin'));

        const btnAddVenue = document.getElementById('btn-header-add-venue');
        if (btnAddVenue) {
          btnAddVenue.addEventListener('click', () => {
            AddVenueModal.show({
              onVenueAdded: (newVenue) => {
                this.selectedVenue = newVenue;
                setTabActive('explore');
              }
            });
          });
        }

        const btnQuickPlayer = document.getElementById('btn-quick-player');
        if (btnQuickPlayer) {
          btnQuickPlayer.addEventListener('click', () => {
            UserAuthModal.show({
              onUserChanged: (user) => {
                this.updateHeaderUser();
                this.renderView(this.currentView);
              }
            });
          });
        }

        document.getElementById('mobile-tab-explore').addEventListener('click', () => setTabActive('explore'));
        document.getElementById('mobile-tab-bookings').addEventListener('click', () => setTabActive('bookings'));
        document.getElementById('mobile-tab-partner').addEventListener('click', () => setTabActive('partner'));
        document.getElementById('mobile-tab-admin').addEventListener('click', () => setTabActive('admin'));
      }

        document.getElementById('mobile-tab-explore').addEventListener('click', () => setTabActive('explore'));
        document.getElementById('mobile-tab-bookings').addEventListener('click', () => setTabActive('bookings'));
        document.getElementById('mobile-tab-partner').addEventListener('click', () => setTabActive('partner'));
        document.getElementById('mobile-tab-admin').addEventListener('click', () => setTabActive('admin'));
      }

      bindLegalEvents() {
        document.getElementById('footer-link-tos').addEventListener('click', () => LegalModal.show('tos'));
        document.getElementById('footer-link-privacy').addEventListener('click', () => LegalModal.show('privacy'));
        document.getElementById('footer-link-injury').addEventListener('click', () => LegalModal.show('injury'));
      }

      renderView(viewName) {
        this.appRoot.innerHTML = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        switch (viewName) {
          case 'explore': {
            const explorer = new VenueExplorer({
              onSelectVenue: (venue) => {
                this.selectedVenue = venue;
                this.renderView('slots');
              }
            });
            explorer.render(this.appRoot);
            break;
          }
          case 'slots': {
            if (!this.selectedVenue) {
              this.renderView('explore');
              return;
            }
            const calendar = new SlotCalendar({
              venue: this.selectedVenue,
              onProceedToCheckout: (bookingContext) => {
                const checkout = new CheckoutModal({
                  bookingContext,
                  onBookingSuccess: (booking) => {
                    this.activeBooking = booking;
                    this.renderView('confirmation');
                  },
                  onCancel: () => {
                    calendar.render(this.appRoot);
                  }
                });
                checkout.show();
              },
              onBack: () => {
                this.renderView('explore');
              }
            });
            calendar.render(this.appRoot);
            break;
          }
          case 'confirmation': {
            if (!this.activeBooking) {
              this.renderView('explore');
              return;
            }
            const confirmation = new BookingConfirmation({
              booking: this.activeBooking,
              onViewBookings: () => this.renderView('bookings'),
              onHome: () => this.renderView('explore')
            });
            confirmation.render(this.appRoot);
            break;
          }
          case 'bookings': {
            const portal = new PlayerPortal({
              onBack: () => this.renderView('explore'),
              onShowPass: (booking) => {
                this.activeBooking = booking;
                this.renderView('confirmation');
              }
            });
            portal.render(this.appRoot);
            break;
          }
          case 'partner': {
            const ownerPortal = new VenueOwnerPortal({
              onBack: () => this.renderView('explore')
            });
            ownerPortal.render(this.appRoot);
            break;
          }
          case 'admin': {
            const admin = new AdminConsole({
              onBack: () => this.renderView('explore')
            });
            admin.render(this.appRoot);
            break;
          }
          default:
            this.renderView('explore');
        }
      }
    }

    // Initialize application
    window.apexApp = new ApexApp();
  </script>
</body>
</html>
