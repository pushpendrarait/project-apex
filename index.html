  <script type="module">
    import { VenueExplorer } from './src/components/VenueExplorer.js';
    import { SlotCalendar } from './src/components/SlotCalendar.js';
    import { CheckoutModal } from './src/components/CheckoutModal.js';
    import { BookingConfirmation } from './src/components/BookingConfirmation.js';
    import { PlayerPortal } from './src/components/PlayerPortal.js';
    import { VenueOwnerPortal } from './src/components/VenueOwnerPortal.js';
    import { AdminConsole } from './src/components/AdminConsole.js';
    import { LegalModal } from './src/components/LegalModal.js';
    import { VenueService } from './src/services/venueService.js';
    import { BookingService } from './src/services/bookingService.js';
    import { UserService } from './src/services/userService.js';
    import { AddVenueModal } from './src/components/AddVenueModal.js';
    import { UserAuthModal } from './src/components/UserAuthModal.js';
    import { ScenarioRunnerModal } from './src/components/ScenarioRunnerModal.js';
    import { ApiClient } from './src/services/apiClient.js';

    const RENDER_PRESET_URL = 'https://project-apex-backend-fqe3.onrender.com/api/v1';
    const LOCAL_PRESET_URL = 'http://localhost:8080/api/v1';

    class ApexApp {
      constructor() {
        this.appRoot = document.getElementById('app-root');
        this.currentView = 'explore';
        this.selectedVenue = null;
        this.activeBooking = null;
        this.explorer = null;
        this.lastHealth = null;
        this.init();
      }

      init() {
        this.updateHeaderUser();
        this.bindNavEvents();
        this.bindHeaderLocationAndSearch();
        this.bindLegalEvents();
        this.checkBackendHealth();
        this.syncInitialCloudState();
        this.registerServiceWorker();
        this.renderView('explore');

        const pathname = window.location.pathname.replace(/\/+$/, '').toLowerCase();
        const authParam = (new URLSearchParams(window.location.search).get('auth') || '').toLowerCase();
        const hash = window.location.hash.toLowerCase();
        if (
          pathname === '/login' ||
          pathname === '/signin' ||
          authParam === 'login' ||
          authParam === 'signin' ||
          hash === '#login' ||
          hash === '#signin'
        ) {
          this.openAuthModal('signin');
        } else if (
          pathname === '/register' ||
          pathname === '/signup' ||
          authParam === 'register' ||
          authParam === 'signup' ||
          hash === '#register' ||
          hash === '#signup'
        ) {
          this.openAuthModal('register');
        }
      }

      async syncInitialCloudState() {
        try {
          await VenueService.syncVenuesFromBackend();
          if (ApiClient.getToken()) {
            const meRes = await ApiClient.getMe().catch(() => null);
            if (meRes && meRes.data && meRes.data.uid) {
              const raw = meRes.data;
              const syncedUser = {
                ...raw,
                displayName: raw.displayName || raw.fullName || 'Apex User',
                venueId: raw.venueId || null
              };
              const { mockDb } = await import('./src/services/firebaseConfig.js');
              mockDb.data.users[syncedUser.uid] = { ...(mockDb.data.users[syncedUser.uid] || {}), ...syncedUser };
              mockDb.persist();
              UserService.setCurrentUser(syncedUser.uid);
              this.updateHeaderUser();
              await BookingService.syncMyBookingsFromBackend();
            }
          }
          if (this.currentView === 'explore') {
            this.renderView('explore');
          }
        } catch (e) {
          console.warn('[ApexApp] Initial cloud hydration warning:', e.message);
        }
      }

      openAuthModal(initialTab = 'signin') {
        UserAuthModal.show({
          initialTab,
          onUserChanged: () => {
            this.updateHeaderUser();
            this.renderView(this.currentView);
          },
          onNavigate: (view) => {
            if (this.setTabActive) this.setTabActive(view);
            else this.renderView(view);
          }
        });
      }

      escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      extractHealthMetadata(health, targetUrl = ApiClient.getBaseUrl()) {
        const info = health?.data?.data || health?.data || {};
        const isOnline = Boolean(health?.isOnline);
        const normalizedUrl = ApiClient.normalizeBaseUrl(targetUrl || '') || ApiClient.getBaseUrl();
        const isLocal = normalizedUrl.includes('localhost') || normalizedUrl.includes('127.0.0.1');
        const dbName = info.database || (isOnline ? 'Neon PostgreSQL' : 'Neon Serverless PostgreSQL');
        const dbConnected = typeof info.dbConnected === 'boolean' ? info.dbConnected : isOnline;
        return {
          isOnline,
          isLocal,
          targetUrl: normalizedUrl,
          latencyMs: typeof health?.latencyMs === 'number' ? health.latencyMs : null,
          error: health?.error || null,
          service: info.service || 'project-apex-backend',
          hosting: info.hosting || (isLocal ? 'Localhost Dev (Port 8080)' : 'Render Cloud Middleware'),
          runtime: info.runtime || 'Java 21 LTS + Spring Boot 3.2.x',
          database: dbName,
          dbConnected,
          usersCount: info.usersCount ?? '—',
          venuesCount: info.venuesCount ?? '—',
          bookingsCount: info.bookingsCount ?? '—'
        };
      }

      applyBackendHealthUI(health) {
        this.lastHealth = health;
        const btn = document.getElementById('btn-header-backend');
        const dot = document.getElementById('header-backend-dot');
        const label = document.getElementById('header-backend-label');
        if (!dot || !label) return;

        const meta = this.extractHealthMetadata(health);
        if (meta.isOnline) {
          const tier2Short = meta.isLocal ? 'Java' : 'Render';
          const dbShort = meta.database.toLowerCase().includes('h2') ? 'H2' : 'Neon';
          dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
          label.textContent = meta.dbConnected ? `${tier2Short} + ${dbShort}` : `${tier2Short}: Online`;
          label.className = 'text-emerald-400 font-bold';
          if (btn) {
            btn.title = `3-Tier Live: Firebase Hosting → ${meta.hosting} (${meta.service}) → ${meta.database} (${meta.dbConnected ? 'Connected' : 'Disconnected'})`;
          }
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-amber-400';
          label.textContent = 'API: Standby';
          label.className = 'text-amber-300 font-semibold';
          if (btn) {
            btn.title = '3-Tier Status: Render Java API standby/offline (using resilient local edge cache). Click to inspect or wake.';
          }
        }
      }

      async checkBackendHealth() {
        try {
          const health = await ApiClient.checkHealth();
          this.applyBackendHealthUI(health);
          return health;
        } catch (e) {
          const fallback = { isOnline: false, error: e.message };
          this.applyBackendHealthUI(fallback);
          return fallback;
        }
      }

      updateHeaderUser() {
        const user = UserService.getCurrentUser();
        const avatar = document.getElementById('header-user-avatar');
        const nameEl = document.getElementById('header-user-name');
        const roleEl = document.getElementById('header-user-role');
        const authBtn = document.getElementById('btn-header-auth');

        if (user) {
          if (avatar) {
            avatar.textContent = user.displayName.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
            avatar.className = ApiClient.isOwnerRole(user.role)
              ? 'w-6 h-6 rounded-lg bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 font-black text-[11px] flex items-center justify-center'
              : 'w-6 h-6 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 font-black text-[11px] flex items-center justify-center';
          }
          if (nameEl) {
            nameEl.textContent = user.displayName.split(' ')[0];
          }
          if (roleEl) {

      bindHeaderLocationAndSearch() {
        const locBtn = document.getElementById('btn-location-selector');
        const locFlyout = document.getElementById('location-dropdown-flyout');
        const locLabel = document.getElementById('current-location-label');
        const omniSearch = document.getElementById('header-omni-search');

        if (locBtn && locFlyout) {
          locBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            locFlyout.classList.toggle('hidden');
          });

          document.addEventListener('click', () => {
            locFlyout.classList.add('hidden');
          });

          locFlyout.querySelectorAll('.loc-option').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const city = e.currentTarget.getAttribute('data-city');
              if (locLabel) {
                locLabel.textContent = city === 'all' ? 'All Cities' : city.charAt(0).toUpperCase() + city.slice(1);
              }
              locFlyout.classList.add('hidden');

              if (this.currentView !== 'explore') {
                this.setTabActive('explore');
              }
              if (this.explorer) {
                this.explorer.setCity(city);
              }
            });
          });
        }

        // Omni-search input
        if (omniSearch) {
          omniSearch.addEventListener('input', (e) => {
            const query = e.target.value;
            if (this.currentView !== 'explore') {
              this.setTabActive('explore');
            }
            if (this.explorer) {
              this.explorer.setSearch(query);
            }
          });
        }

        // Quick area chips
        document.querySelectorAll('.header-area-chip').forEach(chip => {
          chip.addEventListener('click', (e) => {
            const area = e.currentTarget.getAttribute('data-area');
            if (this.currentView !== 'explore') {
              this.setTabActive('explore');
            }
            if (this.explorer) {
              this.explorer.setSearch(area);
            }
          });
        });

        // Keyboard shortcut "/" to focus omni-search
        window.addEventListener('keydown', (e) => {
          if (e.key === '/' && document.activeElement !== omniSearch && omniSearch) {
            e.preventDefault();
            omniSearch.focus();
          }
        });
      }

      openBackendArchitectureModal() {

        const initialHealth = this.lastHealth || { isOnline: false };

        let modal = document.getElementById('apex-backend-modal');
        if (!modal) {
          modal = document.createElement('div');
          modal.id = 'apex-backend-modal';
          modal.className = 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md animate-fade-in text-xs text-white';
          document.body.appendChild(modal);
        }

        modal.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xl w-full p-6 shadow-2xl space-y-4 max-h-[92vh] overflow-y-auto">
            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
              <div class="flex items-center gap-2.5">
                <span id="modal-backend-dot" class="w-3 h-3 rounded-full bg-indigo-400 animate-pulse"></span>
                <div>
                  <h3 class="text-lg font-black leading-tight">3-Tier Live Architecture</h3>
                  <p class="text-[11px] text-slate-400">Firebase Hosting → Render Java API → Neon PostgreSQL</p>
                </div>
              </div>
              <button id="btn-close-backend-modal" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center" aria-label="Close">✕</button>
            </div>

            <div id="backend-architecture-tiers">
              ${this.renderArchitectureTiersHtml(initialHealth, currentUrl, true)}
            </div>

            <div class="space-y-2 pt-1">
              <div class="flex items-center justify-between gap-2">
                <label for="input-backend-url" class="block font-bold uppercase tracking-wider text-slate-400">Tier 2 Middleware API URL</label>
                <div class="flex items-center gap-1.5">
                  <button type="button" id="btn-preset-render" class="px-2.5 py-1 rounded-lg text-[10px] font-bold border transition">☁️ Render Prod</button>
                  <button type="button" id="btn-preset-local" class="px-2.5 py-1 rounded-lg text-[10px] font-bold border transition">💻 Localhost Dev</button>
                </div>
              </div>
              <input id="input-backend-url" type="url" value="${this.escapeHtml(currentUrl)}" placeholder="${RENDER_PRESET_URL}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 font-mono text-xs text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
              <p class="text-[10px] text-slate-500">Auto-normalizes trailing slashes and appends <span class="font-mono text-slate-400">/api/v1</span> when saved or pinged.</p>
            </div>

            <div id="backend-ping-result" class="hidden text-[11px] p-2.5 rounded-xl"></div>

            <div class="pt-3 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <button type="button" id="btn-reset-backend-url" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition">Reset to Default</button>
              <div class="flex gap-2">
                <button type="button" id="btn-test-backend-ping" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition">Test Ping</button>
                <button type="button" id="btn-save-backend-url" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-black transition">Save & Apply</button>
              </div>
            </div>
          </div>
        `;

        const close = () => modal.remove();
        modal.querySelector('#btn-close-backend-modal').addEventListener('click', close);

        const tiersContainer = modal.querySelector('#backend-architecture-tiers');
        const modalDot = modal.querySelector('#modal-backend-dot');
        const inputUrl = modal.querySelector('#input-backend-url');
        const pingResult = modal.querySelector('#backend-ping-result');
        const btnPresetRender = modal.querySelector('#btn-preset-render');
        const btnPresetLocal = modal.querySelector('#btn-preset-local');

        const syncPresetHighlights = () => {
          const normalized = ApiClient.normalizeBaseUrl(inputUrl.value);
          const isRenderSelected = normalized === RENDER_PRESET_URL;
          const isLocalSelected = normalized === LOCAL_PRESET_URL;

          btnPresetRender.className = isRenderSelected
            ? 'px-2.5 py-1 rounded-lg text-[10px] font-bold border bg-emerald-500/20 text-emerald-300 border-emerald-500/40 transition'
            : 'px-2.5 py-1 rounded-lg text-[10px] font-bold border bg-slate-800/80 text-slate-400 border-slate-700 hover:text-white transition';
          btnPresetLocal.className = isLocalSelected
            ? 'px-2.5 py-1 rounded-lg text-[10px] font-bold border bg-indigo-500/20 text-indigo-300 border-indigo-500/40 transition'
            : 'px-2.5 py-1 rounded-lg text-[10px] font-bold border bg-slate-800/80 text-slate-400 border-slate-700 hover:text-white transition';
        };

        const updateModalHealthView = (health, targetUrl, isChecking = false) => {
          if (!modal.isConnected) return;
          tiersContainer.innerHTML = this.renderArchitectureTiersHtml(health, targetUrl, isChecking);
          modalDot.className = isChecking
            ? 'w-3 h-3 rounded-full bg-indigo-400 animate-pulse'
            : health?.isOnline
              ? 'w-3 h-3 rounded-full bg-emerald-400 animate-pulse'
              : 'w-3 h-3 rounded-full bg-amber-400';
        };

        syncPresetHighlights();
        inputUrl.addEventListener('input', syncPresetHighlights);

        let checkSeq = 0;

        // Live-refresh current configured endpoint immediately on modal open
        (async () => {
          const seq = ++checkSeq;
          const liveHealth = await ApiClient.checkHealth();
          if (seq !== checkSeq || !modal.isConnected) return;
          this.applyBackendHealthUI(liveHealth);
          updateModalHealthView(liveHealth, ApiClient.getBaseUrl(), false);
        })();

        btnPresetRender.addEventListener('click', () => {
          inputUrl.value = RENDER_PRESET_URL;
          syncPresetHighlights();
        });

        btnPresetLocal.addEventListener('click', () => {
          inputUrl.value = LOCAL_PRESET_URL;
          syncPresetHighlights();
        });

        modal.querySelector('#btn-reset-backend-url').addEventListener('click', () => {
          const defaultUrl = ApiClient.resetBaseUrl();
          inputUrl.value = defaultUrl;
          syncPresetHighlights();
          pingResult.className = 'text-[11px] p-2.5 rounded-xl bg-slate-800 text-slate-300 block';
          pingResult.textContent = `Reset to environment default: ${defaultUrl}`;
        });

        modal.querySelector('#btn-test-backend-ping').addEventListener('click', async () => {
          const normalized = ApiClient.normalizeBaseUrl(inputUrl.value);
          if (!normalized) {
            pingResult.className = 'text-[11px] p-2.5 rounded-xl bg-red-950 border border-red-500/40 text-red-300 block';
            pingResult.textContent = 'Please enter a valid backend URL before pinging.';
            return;
          }
          inputUrl.value = normalized;
          syncPresetHighlights();

          const seq = ++checkSeq;
          updateModalHealthView(this.lastHealth || { isOnline: false }, normalized, true);
          pingResult.className = 'text-[11px] p-2.5 rounded-xl bg-slate-800 text-slate-300 block';
          pingResult.textContent = `Pinging ${normalized}/health (up to 8s for Render cold starts)...`;

          const health = await ApiClient.checkHealth(normalized);
          if (seq !== checkSeq || !modal.isConnected) return;

          updateModalHealthView(health, normalized, false);
          if (health.isOnline) {
            const meta = this.extractHealthMetadata(health, normalized);
            pingResult.className = 'text-[11px] p-2.5 rounded-xl bg-emerald-950 border border-emerald-500/40 text-emerald-300 block';
            pingResult.textContent = `✓ 200 OK (${health.latencyMs}ms) • ${meta.service} (${meta.hosting}) • DB: ${meta.database} [${meta.dbConnected ? 'Connected' : 'Disconnected'}]`;
          } else {
            pingResult.className = 'text-[11px] p-2.5 rounded-xl bg-red-950 border border-red-500/40 text-red-300 block';
            pingResult.textContent = `Ping failed (${health.error || 'unreachable'}). If Render free tier is waking up, wait a few seconds and retry Test Ping.`;
          }
        });

        modal.querySelector('#btn-save-backend-url').addEventListener('click', async () => {
          const raw = inputUrl.value.trim();
          if (!raw) {
            ApiClient.resetBaseUrl();
          } else {
            const normalized = ApiClient.normalizeBaseUrl(raw);
            if (normalized === ApiClient.getDefaultBaseUrl() && !(typeof window !== 'undefined' && window.APEX_API_URL)) {
              ApiClient.resetBaseUrl();
            } else {
              ApiClient.setBaseUrl(normalized);
            }
          }
          await this.checkBackendHealth();
          close();
        });
      }

      renderView(viewName) {
        this.appRoot.innerHTML = '';
        window.scrollTo({ top: 0, behavior: 'smooth' });

        switch (viewName) {
          case 'explore': {
            const explorer = new VenueExplorer({
              onSelectVenue: (venue) => {
                this.selectedVenue = venue;
                this.renderView('slots');
              },
              onUserChanged: (user) => {
                this.updateHeaderUser();
              },
              onNavigate: (view) => {
                if (this.setTabActive) this.setTabActive(view);
                else this.renderView(view);
              }
            });
            this.explorer = explorer;
            explorer.render(this.appRoot);
            break;
          }
          case 'slots': {
            if (!this.selectedVenue) {
              this.renderView('explore');
              return;
            }
            const calendar = new SlotCalendar({
              venue: this.selectedVenue,
              onProceedToCheckout: (bookingContext) => {
                const checkout = new CheckoutModal({
                  bookingContext,
                  onBookingSuccess: (booking) => {
                    this.activeBooking = booking;
                    this.renderView('confirmation');
                  },
                  onCancel: () => {
                    calendar.render(this.appRoot);
                  }
                });
                checkout.show();
              },
              onBack: () => {
                this.renderView('explore');
              }
            });
            calendar.render(this.appRoot);
            break;
          }
          case 'confirmation': {
            if (!this.activeBooking) {
              this.renderView('explore');
              return;
            }
            const confirmation = new BookingConfirmation({
              booking: this.activeBooking,
              onViewBookings: () => this.renderView('bookings'),
              onHome: () => this.renderView('explore')
            });
            confirmation.render(this.appRoot);
            break;
          }
          case 'bookings': {
            const portal = new PlayerPortal({
              onBack: () => this.renderView('explore'),
              onShowPass: (booking) => {
                this.activeBooking = booking;
                this.renderView('confirmation');
              },
              onUserChanged: () => {
                this.updateHeaderUser();
              }
            });
            portal.render(this.appRoot);
            break;
          }
          case 'partner': {
            const ownerPortal = new VenueOwnerPortal({
              onBack: () => this.renderView('explore')
            });
            ownerPortal.render(this.appRoot);
            break;
          }
          case 'admin': {
            const admin = new AdminConsole({
              onBack: () => this.renderView('explore')
            });
            admin.render(this.appRoot);
            break;
          }
          default:
            this.renderView('explore');
        }
      }
    }

    // Initialize application
    window.apexApp = new ApexApp();
  </script>
