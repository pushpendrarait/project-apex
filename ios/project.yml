name: ProjectApex
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ProjectApex:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ProjectApex/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.projectapex
        PRODUCT_NAME: ProjectApex
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Project Apex"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
  ProjectApexTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ProjectApex/Tests
    dependencies:
      - target: ProjectApex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.projectapex.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ProjectApex:
    build:
      targets:
        ProjectApex: all
        ProjectApexTests: [test]
    test:
      targets:
        - ProjectApexTests
