# Project Apex - Spring Boot Middleware Configuration
spring.application.name=project-apex-backend
server.port=${PORT:${SERVER_PORT:8080}}

# Database & JPA Configuration (Schema managed idempotently by NeonPersistenceService via db/schema.sql)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Logging
logging.level.com.projectapex=INFO
logging.level.org.springframework.web=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.springframework.jdbc=WARN

# Firebase Hosted Cloud Firestore Configuration
firebase.project-id=${FIREBASE_PROJECT_ID:project-apex-pushp}
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# Razorpay Payment Gateway Configuration (Test Mode credentials)
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_1DP5mmOlF5G5ag}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:s3cr3t_t3st_k3y_4p3x}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:whsec_apex_test_secret_2026}
razorpay.currency=INR

# JWT & Security
jwt.secret=${JWT_SECRET:ApexSecretKeyForJwtTokenSigningThaneMumbaiSportsFacilityBooking2026Platform}
jwt.expiration-ms=86400000
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://project-apex-pushp.web.app,https://project-apex-pushp.firebaseapp.com}

# Platform Business Rules
app.owner.auto-approve=${APP_OWNER_AUTO_APPROVE:true}
app.booking.hold-minutes=${BOOKING_HOLD_MINUTES:10}
app.concurrency.lock-ttl-seconds=300
app.otp.ttl-seconds=300

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=venues,resources,sports,discounts
